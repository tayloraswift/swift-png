#  ❣❣❣  DO NOT EDIT  ❣  THIS FILE IS AUTOMATICALLY SYNCED  ❣  DO NOT EDIT  ❣❣❣

name: Semantic release

concurrency:
    group: semantic-release
    cancel-in-progress: false

permissions:
    contents: write
    actions: read
on:
    workflow_run:
        workflows:
            - Semantic release dispatch
        types:
            - completed

jobs:
    release:
        name: Release
        # ensures this only runs if the dispatch workflow completed successfully
        if: github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.increment.outputs.version }}
        steps:
            -   name: ⚡ Checkout repository ⚡
                uses: actions/checkout@v6
                with:
                    # fetch all history so the workflow can find previous tags
                    fetch-depth: 0

            -   name: ⚡ Download bump metadata ⚡
                uses: actions/download-artifact@v4
                with:
                    name: bump-metadata
                    path: ${{ runner.temp }}
                    run-id: ${{ github.event.workflow_run.id }}
                    github-token: ${{ secrets.GITHUB_TOKEN }}

            -   name: ⚡ Increment version ⚡
                id: increment
                run: |
                    BUMP_TYPE=$(cat "${{ runner.temp }}/bump.txt")

                    LATEST_VERSION=$(git tag | \
                        sed -E -n 's/^v//; /^[0-9]+\.[0-9]+\.[0-9]+$/p' | \
                        sort -V | tail -n 1)

                    if [ -z "$LATEST_VERSION" ]; then
                        LATEST_VERSION="0.0.0"
                    fi

                    echo "Current highest version identified: $LATEST_VERSION"

                    IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"

                    if [ "$BUMP_TYPE" == "major" ]; then
                        MAJOR=$((MAJOR + 1))
                        MINOR=0
                        PATCH=0
                    elif [ "$BUMP_TYPE" == "minor" ]; then
                        MINOR=$((MINOR + 1))
                        PATCH=0
                    elif [ "$BUMP_TYPE" == "patch" ]; then
                        PATCH=$((PATCH + 1))
                    else
                        echo "::error::Unrecognized bump type: '$BUMP_TYPE'" >&2
                        exit 1
                    fi

                    NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
                    echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
    publish:
        name: Publish Release
        needs:
            -   release

        runs-on: ubuntu-24.04-arm
        env:
            # toggle to 'false' to only push the tag and skip creating the GitHub Release
            CREATE_RELEASE: 'true'
        steps:
            -   name: ⚡ Checkout repository ⚡
                uses: actions/checkout@v6
                with:
                    # fetch all history so the release commit can be merged into the branch
                    fetch-depth: 0

            -   name: ⚡ Install rarestcheck tool ⚡
                uses: rarestype/r2-install-action@v1
                with:
                    tracker: rarestype/rarestcheck
                    project: rarestcheck
                    archive: rarestcheck.tar.gz

            -   name: ⚡ Configure git ⚡
                run: |
                    git config user.name "rarest automation"
                    git config user.email "automation@noreply.rarestype.com"

            -   name: ⚡ Run README hook ⚡
                run: |
                    if [ -f README.md ]; then
                        rarestcheck sync-readme README.md \
                            --repo ${{ github.repository }} \
                            --version ${{ needs.release.outputs.version }}

                        git add README.md
                    fi

            -   name: ⚡ Create tag ⚡
                env:
                    VERSION: ${{ needs.release.outputs.version }}
                    BRANCH: ${{ github.ref_name }}
                run: |
                    # if the pre-release script modified anything but the README, abort release
                    git diff --exit-code

                    # the tag marks the commit that was deployed, plus its README update
                    git commit --allow-empty -m "[release]: $VERSION"
                    git tag "$VERSION"

                    # pull requests may have merged while the release was deploying, so the
                    # release commit is merged into the branch if it can’t fast-forward. the
                    # tag and the branch are pushed atomically, so neither lands without the
                    # other, and a push that loses a race fetches the branch and tries again.
                    for attempt in 1 2 3 4 5; do
                        git fetch origin "$BRANCH"
                        if git merge-base --is-ancestor FETCH_HEAD "$VERSION"; then
                            git checkout --detach "$VERSION"
                        else
                            git checkout --detach FETCH_HEAD
                            # the release commit only changes the README’s version, and this
                            # release is the newest, so its side wins any conflict
                            git merge --no-ff -X theirs -m "[release]: $VERSION" "$VERSION"
                        fi
                        if git push --atomic origin \
                            "HEAD:refs/heads/$BRANCH" "refs/tags/$VERSION"; then
                            exit 0
                        fi
                    done

                    echo "::error::Couldn’t push $VERSION to $BRANCH" >&2
                    exit 1

            -   name: ⚡ Create release ⚡
                if: env.CREATE_RELEASE == 'true'
                run: |
                    gh release create "${{ needs.release.outputs.version }}" \
                        --title "${{ needs.release.outputs.version }}" \
                        --generate-notes
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
